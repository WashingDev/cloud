<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    .echo-waves {
      transform-box: fill-box;
      transform-origin: center;
      animation: echo-pulse 2.8s ease-in-out infinite;
    }
    .echo-waves-delayed {
      animation-delay: 1.4s;
    }
    @keyframes echo-pulse {
      0%, 100% { opacity: .25; transform: scale(.94); }
      50% { opacity: .95; transform: scale(1.04); }
    }
    @media (prefers-reduced-motion: reduce) {
      .echo-waves, .echo-waves-delayed {
        animation: none;
        opacity: .65;
      }
    }
  </style>
  <path d="M32 4 54 16.5v31L32 60 10 47.5v-31L32 4Z" stroke="#9bb8ff" stroke-width="3" stroke-linejoin="round"/>
  <g class="echo-waves" stroke="#9bb8ff" stroke-width="1.7" stroke-linecap="round">
    <path d="M26 23c-2 2-2 5 0 7M23 20c-4 4-4 9 0 13"/>
  </g>
  <g class="echo-waves echo-waves-delayed" stroke="#9bb8ff" stroke-width="1.7" stroke-linecap="round">
    <path d="M38 23c2 2 2 5 0 7M41 20c4 4 4 9 0 13"/>
  </g>
  <path d="M27 17h10M29 17v14L20.5 46.4A4 4 0 0 0 24 52h16a4 4 0 0 0 3.5-5.6L35 31V17" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M23 43h18M24 39h4l2.7-4 3.5 7 3.1-5H41" stroke="#f06b68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>